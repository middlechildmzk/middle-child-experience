name: Astra QA regression
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/qa/**'
      - 'package.json'
      - '.github/workflows/astra-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Responsive, keyboard, selection, consent and social regressions
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/bvss-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/learn > /dev/null && break
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:3000 npm run test:qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-qa-renders
          path: test-results/astra-qa
